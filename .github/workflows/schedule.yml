name: JKK monitor schedule

# Flyマシンを稼働時間帯だけ起動/停止してコストを抑える。
# 監視時間帯: 月〜土 7:15〜20:30 (JST)。日曜は終日停止。
#
# 【設計方針】GitHubのscheduleは混雑時に数時間遅れたり、実行自体が欠落することがある
# （2026-08-27: STARTが5時間遅れ、STOPは未実行のまま夜通し稼働した）。
# そのため「どのcronが発火したか」ではなく「実行時点のJST時刻」で
# あるべき状態を判断し、収束させる。どのcronが遅れても・欠けても、
# 次のcronが正しい状態へ戻す。

on:
  schedule:
    # ※UTC表記。JST = UTC+9
    - cron: '15 22 * * 0-5'   # 07:15 JST 起動
    - cron: '45 22 * * 0-5'   # 07:45 JST 起動の取りこぼし対策
    - cron: '0  1  * * 1-6'   # 10:00 JST 午前の復旧用（朝の起動が欠落した場合）
    - cron: '30 11 * * 1-6'   # 20:30 JST 停止
    - cron: '30 12 * * 1-6'   # 21:30 JST 停止の取りこぼし対策
    - cron: '0  15 * * *'     # 00:00 JST 夜間の最終防波堤（必ず停止側になる）
  workflow_dispatch:
    inputs:
      action:
        description: 'auto=時刻で自動判定 / start / stop'
        required: false
        type: choice
        options: [auto, start, stop]
        default: auto

concurrency:
  group: jkk-schedule
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: jkk-watcher-kyoji
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Decide action
        id: decide
        env:
          INPUT_ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          # 稼働窓: 月〜土(JST) の 07:15〜20:30
          WIN_START=$((7 * 60 + 15))
          WIN_END=$((20 * 60 + 30))
          DOW=$(TZ=Asia/Tokyo date +%u)          # 1=月 ... 7=日
          HH=$(TZ=Asia/Tokyo date +%H)
          MM=$(TZ=Asia/Tokyo date +%M)
          NOW=$((10#$HH * 60 + 10#$MM))

          if [ "$DOW" -le 6 ] && [ "$NOW" -ge "$WIN_START" ] && [ "$NOW" -lt "$WIN_END" ]; then
            AUTO=start
          else
            AUTO=stop
          fi

          ACTION="${INPUT_ACTION:-auto}"
          if [ "$ACTION" = "auto" ] || [ -z "$ACTION" ]; then
            ACTION="$AUTO"
          fi

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "JST $(TZ=Asia/Tokyo date '+%m/%d %H:%M (%a)') / 窓内判定=$AUTO / 実行=$ACTION"

      - name: Apply
        run: |
          set -euo pipefail
          ACTION="${{ steps.decide.outputs.action }}"
          IDS=$(flyctl machine list -a "$FLY_APP" --json | jq -r '.[].id')
          if [ -z "$IDS" ]; then echo "machine not found"; exit 1; fi
          for id in $IDS; do
            echo ">> flyctl machine $ACTION $id"
            flyctl machine "$ACTION" "$id" -a "$FLY_APP" || echo "(既に$ACTION状態か、エラー)"
          done
          echo "--- 現在の状態 ---"
          flyctl machine list -a "$FLY_APP"
