# Fly.io 設定
# アプリ名はグローバルで一意である必要があります。既に使われていたら変更してください。
app = "jkk-watcher-kyoji"
primary_region = "nrt"  # 東京リージョン

[build]

# 永続ボリューム（seen_properties.json を再起動・再デプロイ後も保持）
[mounts]
  source = "jkk_data"
  destination = "/data"

[env]
  INTERVAL_SEC = "180"  # 3分ごと

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
