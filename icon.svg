<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景グラデーション -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)"/>
  
  <!-- 家のアイコン -->
  <g transform="translate(256, 256)">
    <!-- 屋根 -->
    <path d="M -120,-80 L 0,-160 L 120,-80 L 100,-80 L 100,100 L -100,100 L -100,-80 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- ドア -->
    <rect x="-30" y="20" width="60" height="80" rx="5" fill="#667eea"/>
    
    <!-- 窓（左） -->
    <rect x="-80" y="-30" width="35" height="35" rx="3" fill="#667eea"/>
    
    <!-- 窓（右） -->
    <rect x="45" y="-30" width="35" height="35" rx="3" fill="#667eea"/>
    
    <!-- NEW バッジ -->
    <circle cx="70" cy="-100" r="35" fill="#f5576c"/>
    <text x="70" y="-90" font-family="Arial, sans-serif" font-size="24" 
          font-weight="bold" fill="white" text-anchor="middle">NEW</text>
  </g>
</svg>
